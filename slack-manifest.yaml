display_information:
  name: Attendance
  description: Docházka, události a připomínky
  background_color: "#234e52"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Attendance
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:read
      - groups:read
      - chat:write
      - users:read
      - usergroups:read
      - files:write
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
